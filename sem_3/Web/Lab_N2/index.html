<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ВЕБ. Лабораторная №1</title>
    <link rel="stylesheet" href="css/lab1-styles.css">
</head>
<body>

    <div class="box" id="titleBox">
        <h1>Веселов Фёдор Евгеньевич, P3132, Вариант: 22657 </h1>
    </div>
    <br />
    <div class="content">
        <canvas id="canvas" width="600" height="400"></canvas>

        <form id="parameters"> 
            <label for="coord_X"> Изменение X : </label>
                <div class="xGroup">
                    <button type="button" class="buttonX" value="-5"> -5 </button>
                    <button type="button" class="buttonX" value="-4"> -4 </button>
                    <button type="button" class="buttonX" value="-3"> -3 </button>
                    <button type="button" class="buttonX" value="-2"> -2 </button>
                    <button type="button" class="buttonX" value="-1"> -1 </button>
                    <button type="button" class="buttonX" value="0"> 0   </button> 
                    <button type="button" class="buttonX" value="1"> 1   </button>      
                    <button type="button" class="buttonX" value="2"> 2   </button> 
                    <button type="button" class="buttonX" value="3"> 3   </button>
                </div>
            <label for="coord_Y"> Изменение Y : </label>
                <input type="text" maxlength="8" name="coord_Y" id="coord_Y" placeholder="-3...5" /> 
            <label for="radius"> Изменение R : </label>
                <div class="rGroup">
                    <label><input type="radio" name="radius" value="1" />   1   </label>
                    <label><input type="radio" name="radius" value="1.5" /> 1.5 </label>
                    <label><input type="radio" name="radius" value="2" />   2   </label>
                    <label><input type="radio" name="radius" value="2.5" /> 2.5 </label>
                    <label><input type="radio" name="radius" value="3" />   3   </label>
                </div>
            <input type="submit" value="submit" /> 
        </form>
    </div>
    <br/>
    <table id="results">
        <thead>
            <tr>
                <th> X </th>
                <th> Y </th>
                <th> R </th>
                <th> Res </th>
                <th> Время </th>
            </tr>
        </thead>
        <tbody id="res-body"></tbody>
    </table>

    <script src="js/CreateField.js"></script>
    <script src="js/Storage.js"></script>
    <script src="js/CheckPoint.js"></script>
</body>
</html>
