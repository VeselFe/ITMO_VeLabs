LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule fastcgi_module libexec/apache24/mod_fastcgi.so
LoadModule authn_core_module libexec/apache24/mod_authn_core.so
LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule unixd_module libexec/apache24/mod_unixd.so

# 'Main' server configuration

ServerAdmin 501787@niuitmo.ru
ServerName helios.cs.ifmo.ru:24239

<Directory />
    # запрещает использование локальных конфигурации
    AllowOverride none
    # строго запрещает любой доступ веб-клиентов ко всем файлам и папкам сервера.
    Require all denied
</Directory>

DocumentRoot "/home/studs/s501787/httpd-root/static"
<Directory "/home/studs/s501787/httpd-root/static">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

<IfModule unixd_module>
    User s501787
    Group studs
</IfModule>

<Files ".*">
    Require all denied
</Files>

ErrorLog "/home/studs/s501787/httpd-root/error.log"
PidFile "/home/studs/s501787/httpd-root/httpd.pid"

# LogLevel debug
LogLevel warn
AcceptFilter http none
AcceptFilter https none

<IfModule log_config_module>
    # Формат логирования успешных запросов
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common

    <IfModule logio_module>
      # показывает точное число полученных-отправленных байт
      LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
    </IfModule>

    CustomLog "/home/studs/s501787/httpd-root/access.log" combined
</IfModule>

<IfModule headers_module>
    #
    # Avoid passing HTTP_PROXY environment to CGI's on this or any proxied
    # backend servers which have lingering "httpoxy" defects.
    # 'Proxy' request header is undefined by the IETF, not listed by IANA
    # (?) Защита от прокси 'атак'
    RequestHeader unset Proxy early
</IfModule>

<IfModule mime_module>
    # (?) Насколько я понял, нужны для разъяснения браузеру, какие файлы чем являются, что html это html, а css это стили
    TypesConfig etc/apache24/mime.types

    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

FastCgiIpcDir /home/studs/s501787/httpd-root/tmp
FastCgiExternalServer "/home/studs/s501787/httpd-root/fcgi-bin/lab2-server.jar" -host localhost:24139 -nph
Alias /fcgi-bin/ "/home/studs/s501787/httpd-root/fcgi-bin/"
<Directory "/home/studs/s501787/httpd-root/fcgi-bin">
     AllowOverride None
     Options None
     Require all granted
</Directory>
